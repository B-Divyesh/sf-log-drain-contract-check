[package]
name = "drain-check"
version = "0.1.0"
edition = "2021"
description = "Sample a local log drain and review its data contract."
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-log-drain-contract-check"
homepage = "https://log-drain-contract-check.sociobot.in"
documentation = "https://log-drain-contract-check.sociobot.in"
exclude = ["target/**", "node_modules/**", "dist/**", ".factory/assets/**"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "drain-check"
path = "src/main.rs"
