[package]
name = "drain-check"
version = "0.1.1"
edition = "2021"
description = "Sample a local log drain and review its fields, size, and sensitive data."
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-log-drain-contract-check"
homepage = "https://log-drain-contract-check.sociobot.in"
documentation = "https://log-drain-contract-check.sociobot.in"
include = [
  "/src/**",
  "/examples/drain.ndjson",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md"
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3.4"
tempfile = "3"
url = "2.4"

[[bin]]
name = "drain-check"
path = "src/main.rs"
